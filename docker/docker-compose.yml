services:
  cc-remote:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cc-remote
    restart: always
    env_file: .env
    volumes:
      # opencode 登录凭证（复用宿主 WSL 侧，单一来源）
      - /home/zzy/.local/share/opencode:/root/.local/share/opencode
      - /home/zzy/.config/opencode:/root/.config/opencode
      # 工作区（挂到与宿主相同的绝对路径：opencode 会话按目录隔离，路径必须一致，GUI/TUI 才能追踪 QQ 会话）
      - /home/zzy/AgentRoot:/home/zzy/AgentRoot
      # 运行配置与提示词（改提示词无需重建镜像）
      - ./config.toml:/app/config.toml:ro
      - ./qq-style.md:/app/qq-style.md:ro
      - ./qq-opencode.json:/app/qq-opencode.json:ro
      # skills（Windows D 盘经 WSL 9P，读取型 IO 可接受）
      - /mnt/d/Zzy的Skill工具包:/skills:ro
      # 会话/队列持久化
      - /home/zzy/AgentRoot/cc-remote/docker/data:/data
      # 宿主→容器状态桥（ToDesk 围观感知等）
      - /home/zzy/AgentRoot/cc-remote/docker/share:/share
    # opencode acp 内嵌 server（TUI attach 实时同步入口，仅本机回环 + 密码）
    ports:
      - "127.0.0.1:14096:14096"
      - "127.0.0.1:9111:9111"   # webhook 唤醒通道（ccwatcher attach 前拉活进程用）
    # v1 不暴露其它端口（cc-connect Dashboard 待 M5 另行启用）
