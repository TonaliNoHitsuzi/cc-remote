# cc-remote 生产配置（容器内路径；凭证经环境变量注入，勿写明文）
data_dir = "/data"

[log]
level = "info"

[display]
mode = "quiet"
show_context_indicator = true
show_workdir_indicator = false
thinking_messages = false
tool_messages = false

turn_timeout_mins = 30
reset_on_idle_mins = 0  # 永不空闲分裂：仅显式 /new 才开新会话（用户要求单一对话域）

[[commands]]
name = "gui"
description = "在电脑上打开 opencode 对话界面"
exec = "touch /share/gui.flag"

[[projects]]
name = "cc-remote"

[projects.agent]
type = "acp"

[projects.agent.options]
work_dir = "/home/zzy/AgentRoot/cc-remote"
cmd = "opencode"
args = ["acp"]
display_name = "OpenCode ACP"

[projects.agent.options.env]
OPENCODE_CONFIG = "/app/qq-opencode.json"

[[projects.platforms]]
type = "qqbot"

[projects.platforms.options]
app_id = "${QQ_APP_ID}"
app_secret = "${QQ_APP_SECRET}"
sandbox = true
allow_from = "${QQ_ALLOW_FROM}"   # 部署后发 /whoami 获取你的 openid，填入 .env（白名单只放你自己）
markdown_support = true
